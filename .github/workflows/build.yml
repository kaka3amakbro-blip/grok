name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project file
        run: |
          # فك ضغط الملف الموجود لديك (تأكد من اسم الملف تماماً)
          unzip meshkhai-github.zip -d project_files
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x project_files/gradlew

      - name: Build Debug APK
        run: |
          cd project_files
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project_files/app/build/outputs/apk/debug/app-debug.apk
