name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project file
        run: |
          mkdir -p project_files
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Unzipping: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project_files

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare and Build APK
        run: |
          # البحث عن مكان ملف بناء الأندرويد
          BUILD_FILE=$(find project_files -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: build.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Project directory is: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # إذا لم يكن gradlew موجوداً، سيقوم النظام بإنشائه تلقائياً
          if [ ! -f "gradlew" ]; then
            echo "gradlew missing, generating gradle wrapper..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
