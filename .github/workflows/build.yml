name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files and Unzip
        run: |
          echo "=== Root Files ==="
          ls -la
          mkdir -p project_files
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Unzipping: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project_files
          echo "=== Extracted Files ==="
          ls -la project_files

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: |
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          echo "Found gradlew at: $GRADLE_PATH"
          chmod +x "$GRADLE_PATH"

      - name: Build Debug APK
        run: |
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          echo "Building from directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
