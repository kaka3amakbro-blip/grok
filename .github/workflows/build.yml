name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Unzip project file
        run: |
          mkdir -p project_files
          # البحث تلقائياً عن أي ملف ZIP وفك ضغطه
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Found zip file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project_files
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: |
          GRADLE_PATH=$(find project_files -name "gradlew" | head -n 1)
          chmod +x "$GRADLE_PATH"

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname $(find project_files -name "gradlew" | head -n 1))
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project_files/**/build/outputs/apk/debug/*.apk
